<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BayTrip অ্যাডমিন</title>
<link rel="icon" href="../icon.png">
<style>
@font-face { font-family: Noirrit; src: url(../fonts/LiAdorNoirrit-Regular.ttf); font-weight: 400; }
@font-face { font-family: Noirrit; src: url(../fonts/LiAdorNoirrit-SemiBold.ttf); font-weight: 600; }
:root {
  --bg: #F3F6F8; --card: #FFFFFF; --ink: #10222C; --muted: #5D707B; --line: #E1E8EC;
  --sea: #0B5C7A; --sea-2: #0B4D68; --sea-soft: #E3F1F6; --accent: #FF8A5C;
  --ok: #1E8E5A; --ok-soft: #E2F4EA; --warn: #B7791F; --warn-soft: #FDF3E1; --bad: #C53B3B; --bad-soft: #FBE7E7;
  --shadow: 0 1px 2px rgba(16,34,44,.06), 0 4px 16px rgba(16,34,44,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C161C; --card: #13222B; --ink: #E7EEF2; --muted: #93A6B1; --line: #233641;
    --sea: #4FB3D9; --sea-2: #0B4D68; --sea-soft: #16323F;
    --ok-soft: #133426; --warn-soft: #3A2C12; --bad-soft: #3B1A1A; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 Noirrit, system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* লগইন */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(1200px 500px at 50% -10%, #1A7FA6 0%, var(--sea-2) 55%, #072F40 100%); }
.login form { width: 100%; max-width: 360px; background: var(--card); border-radius: 20px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.login img { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 10px; }
.login h1 { text-align: center; font-size: 22px; margin: 0; }
.login p.sub { text-align: center; color: var(--muted); margin: 2px 0 20px; font-size: 14px; }

label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=time], input[type=url],
input[type=datetime-local], select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--sea); box-shadow: 0 0 0 3px var(--sea-soft); }
textarea { min-height: 80px; resize: vertical; }

.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--sea); color: #fff; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--sea); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.sm { padding: 6px 10px; font-size: 14px; border-radius: 8px; }
.btn.full { width: 100%; margin-top: 18px; }
.err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; }

/* প্যানেল */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { background: var(--sea-2); color: #fff; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand img { width: 36px; height: 36px; border-radius: 10px; }
.brand b { font-size: 18px; display: block; line-height: 1.1; }
.brand small { opacity: .7; font-size: 12px; }
.nav { border: 0; background: transparent; color: rgba(255,255,255,.78); text-align: left; padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav.on { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.side .grow { flex: 1; }
.who { font-size: 12px; opacity: .7; padding: 0 8px 8px; word-break: break-all; }

main { padding: 28px 32px 60px; max-width: 1080px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 26px; }
.head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card h3 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.stack { display: grid; gap: 16px; }

.rows { display: grid; gap: 8px; }
.row { display: grid; gap: 8px; align-items: center; padding: 8px; border-radius: 12px; background: var(--bg); }
.row.off { opacity: .55; }
.row input[type=text], .row input[type=number], .row input[type=time], .row select { padding: 8px 10px; background: var(--card); }
.trip-row { grid-template-columns: 120px 1fr auto auto auto; }
.fare-row { grid-template-columns: 1fr 100px 1fr auto auto; }
.pin-row { grid-template-columns: 140px 1fr auto; }
.tide-row { grid-template-columns: 90px 1fr 90px 110px auto; font-size: 14px; }
.empty { color: var(--muted); font-size: 14px; padding: 12px; text-align: center; }

.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 22px; background: var(--line); cursor: pointer; transition: .2s; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(18px); }

.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.pill.info { background: var(--sea-soft); color: var(--sea); }
.pill.warning { background: var(--warn-soft); color: var(--warn); }
.pill.closed { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.mute { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

.notice { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--bg); }
.notice p { margin: 4px 0 0; }
.notice small { color: var(--muted); }

.ad { display: grid; gap: 10px; }
.ad .prev { aspect-ratio: 6 / 1; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, var(--sea-soft), var(--bg)); display: grid; place-items: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--line); }
.ad .prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ad .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ad .line > * { flex: 1; min-width: 160px; }
.ad .line > .switch, .ad .line > .btn, .ad .line > .lab { flex: none; min-width: 0; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { font-size: 26px; display: block; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.hint.warn { color: var(--warn); }
.form-inline { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: #10222C; color: #fff; padding: 10px 18px; border-radius: 12px; transition: .25s; z-index: 50; font-size: 15px; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.bad { background: var(--bad); }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: sticky; top: 0; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; z-index: 5; }
  .brand, .who, .side .grow { display: none; }
  .nav { flex: none; padding: 8px 12px; }
  .nav.on { box-shadow: inset 0 -3px 0 var(--accent); }
  main { padding: 18px 16px 60px; }
  .grid2, .stats { grid-template-columns: 1fr 1fr; }
  .trip-row { grid-template-columns: 1fr auto auto auto; }
  .trip-row .vessel { grid-column: 1 / -1; order: 5; }
  .fare-row { grid-template-columns: 1fr 90px; }
  .fare-row .note { grid-column: 1 / -1; }
  .tide-row { grid-template-columns: 70px 1fr 70px auto; }
  .tide-row .src { display: none; }
  .form-inline { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- লগইন -->
<section class="login hidden" id="login">
  <form id="loginForm">
    <img src="../icon.png" alt="">
    <h1>BayTrip অ্যাডমিন</h1>
    <p class="sub">সময়সূচি, ভাড়া, নোটিশ আর বিজ্ঞাপন এখান থেকে বদলান</p>
    <label for="email">ইমেইল</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="pass">পাসওয়ার্ড</label>
    <input type="password" id="pass" autocomplete="current-password" required>
    <button class="btn full" id="loginBtn">লগইন</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- প্যানেল -->
<div class="shell hidden" id="app">
  <aside class="side" id="side">
    <div class="brand"><img src="../icon.png" alt=""><div><b>BayTrip</b><small>অ্যাডমিন প্যানেল</small></div></div>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(BAYTRIP.url, BAYTRIP.anon);
const $ = (s, el = document) => el.querySelector(s);
const BN = '০১২৩৪৫৬৭৮৯';
const bn = (v) => String(v).replace(/\d/g, (d) => BN[+d]);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, bad = false) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.className = 'toast'), 2400);
}
// Supabase-এর উত্তর — ভুল হলে দেখাও আর থামো
function ok(res, msg) {
  if (res.error) { toast('সমস্যা: ' + res.error.message, true); return false; }
  if (msg) toast(msg);
  return true;
}

// "14:30" → "দুপুর ২:৩০" (অ্যাপের মতো)
function fmtTime(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const part = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 15 ? 'দুপুর' : h < 18 ? 'বিকেল' : h < 20 ? 'সন্ধ্যা' : 'রাত';
  return `${part} ${bn((h % 12) || 12)}:${bn(String(m).padStart(2, '0'))}`;
}
// বাংলাদেশ সময়ে তারিখ-সময়
const dhaka = (iso, opt) => new Date(iso).toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka', ...opt });
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'এইমাত্র';
  if (m < 60) return bn(m) + ' মিনিট আগে';
  if (m < 1440) return bn(Math.round(m / 60)) + ' ঘণ্টা আগে';
  return bn(Math.round(m / 1440)) + ' দিন আগে';
}
const sw = (checked, attrs = '') => `<label class="switch"><input type="checkbox" ${checked ? 'checked' : ''} ${attrs}><span></span></label>`;

const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  trips: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="15.5" cy="16" r="2.5"/>',
  fares: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/>',
  notices: '<path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>',
  ads: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="16" cy="9" r="1.5"/>',
  tides: '<path d="M2 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2M2 19c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M12 3v7M9 7l3 3 3-3"/>',
  pins: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.5"/>',
  live: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  out: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

const PAGES = {
  home: { name: 'সারসংক্ষেপ', render: renderHome },
  trips: { name: 'সময়সূচি', render: renderTrips },
  fares: { name: 'ভাড়া', render: renderFares },
  notices: { name: 'নোটিশ', render: renderNotices },
  ads: { name: 'বিজ্ঞাপন', render: renderAds },
  tides: { name: 'জোয়ার-ভাটা', render: renderTides },
  pins: { name: 'ড্রাইভার PIN', render: renderPins },
  live: { name: 'লাইভ সি ট্রাক', render: renderLive },
};
let page = 'home';
let me = null;

function buildNav() {
  const side = $('#side');
  side.querySelectorAll('.nav, .grow, .who').forEach((n) => n.remove());
  for (const [k, p] of Object.entries(PAGES)) {
    const b = document.createElement('button');
    b.className = 'nav' + (k === page ? ' on' : '');
    b.innerHTML = svg(k) + `<span>${p.name}</span>`;
    b.onclick = () => go(k);
    side.append(b);
  }
  side.insertAdjacentHTML('beforeend', `<div class="grow"></div><div class="who">${esc(me.email)}</div>`);
  const out = document.createElement('button');
  out.className = 'nav'; out.innerHTML = svg('out') + '<span>লগআউট</span>';
  out.onclick = async () => { await sb.auth.signOut(); location.reload(); };
  side.append(out);
}
function go(k) {
  page = k;
  try { localStorage.setItem('admin.page', k); } catch {}
  buildNav();
  const main = $('#main');
  main.innerHTML = '<div class="empty">লোড হচ্ছে…</div>';
  PAGES[k].render(main);
}
const head = (title, sub, right = '') =>
  `<div class="head"><div><h2>${title}</h2><p>${sub}</p></div>${right}</div>`;

/* ───── সারসংক্ষেপ ───── */
async function renderHome(main) {
  const [trips, notices, ads, live, tide] = await Promise.all([
    sb.from('trips').select('id', { count: 'exact', head: true }).eq('active', true),
    sb.from('notices').select('id', { count: 'exact', head: true }).eq('active', true),
    sb.from('ads').select('slot, image, active'),
    sb.from('vessel_locations').select('*'),
    sb.from('tides').select('time, fetched_at, source').eq('source', 'worldtides').order('time', { ascending: false }).limit(1),
  ]);
  const adsOn = (ads.data ?? []).filter((a) => a.active && a.image).length;
  const liveOn = (live.data ?? []).filter((v) => v.on_trip && Date.now() - new Date(v.updated_at) < 5 * 60000).length;
  const t = tide.data?.[0];
  main.innerHTML = head('সারসংক্ষেপ', 'অ্যাপে এখন যা দেখাচ্ছে') + `
    <div class="stats">
      <div class="stat"><b>${bn(trips.count ?? 0)}</b><span>চালু ট্রিপ</span></div>
      <div class="stat"><b>${bn(notices.count ?? 0)}</b><span>চালু নোটিশ</span></div>
      <div class="stat"><b>${bn(adsOn)}/৩</b><span>বিজ্ঞাপন চলছে</span></div>
      <div class="stat"><b>${bn(liveOn)}</b><span>এখন লাইভ সি ট্রাক</span></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>জোয়ার-ভাটার ডাটা</h3>
        ${t ? `<p style="margin:0">শেষ আনা হয়েছে <b>${ago(t.fetched_at)}</b>; আছে <b>${dhaka(t.time, { day: 'numeric', month: 'long' })}</b> পর্যন্ত।</p>
        <p class="hint">WorldTides থেকে দিনে দুবার (সকাল ৬টা, সন্ধ্যা ৬টা) নিজে থেকে আসে।</p>`
        : '<p class="hint warn">এখনো কোনো ডাটা আসেনি।</p>'}
      </div>
      <div class="card"><h3>দ্রুত কাজ</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" onclick="go('notices')">নোটিশ দিন</button>
          <button class="btn sm ghost" onclick="go('trips')">সময় বদলান</button>
          <button class="btn sm ghost" onclick="go('ads')">বিজ্ঞাপন বসান</button>
        </div>
        <p class="hint">এখানে যা বদলাবেন, অ্যাপ খোলা বা রিফ্রেশ করলেই যাত্রীরা দেখবেন।</p>
      </div>
    </div>`;
}

/* ───── সময়সূচি ───── */
const DIR = { mk_to_cox: 'মহেশখালী → কক্সবাজার', cox_to_mk: 'কক্সবাজার → মহেশখালী' };
async function renderTrips(main) {
  const res = await sb.from('trips').select('*').order('departs');
  if (!ok(res)) return;
  main.innerHTML = head('সময়সূচি', 'প্রতিটা সারি বদলে "সেভ" চাপুন। বন্ধ করা ট্রিপ অ্যাপে দেখাবে না।') +
    `<div class="grid2">${Object.keys(DIR).map((d) => `
      <div class="card"><h3>${DIR[d]} <button class="btn sm ghost" data-add="${d}">+ ট্রিপ</button></h3>
        <div class="rows" id="dir-${d}">${tripRows(res.data.filter((t) => t.direction === d))}</div>
      </div>`).join('')}</div>`;
  main.querySelectorAll('[data-add]').forEach((b) => (b.onclick = () => {
    const box = $('#dir-' + b.dataset.add);
    box.querySelector('.empty')?.remove();
    box.insertAdjacentHTML('beforeend', tripRow({ id: '', direction: b.dataset.add, departs: '', vessel: '', active: true }));
    box.lastElementChild.querySelector('input[type=time]').focus();
  }));
  main.onclick = async (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const id = row.dataset.id;
    if (e.target.dataset.act === 'save') {
      const departs = row.querySelector('[name=departs]').value;
      if (!departs) return toast('সময় দিন', true);
      const v = { direction: row.dataset.dir, departs, vessel: row.querySelector('[name=vessel]').value.trim() || null,
        active: row.querySelector('[name=active]').checked };
      const r = id ? await sb.from('trips').update(v).eq('id', id) : await sb.from('trips').insert(v);
      if (ok(r, 'সেভ হয়েছে')) renderTrips(main);
    }

        <div class="line">
          <input type="file" accept="image/png,image/jpeg,image/webp" name="file">
          <input type="text" name="url" value="${esc(a.url)}" placeholder="চাপলে যা খুলবে: https://… বা tel:01XXXXXXXXX">
        </div>
        <div class="line">
          <input type="text" name="advertiser" value="${esc(a.advertiser)}" placeholder="বিজ্ঞাপনদাতা (নিজের হিসাবের জন্য)">
          <span class="lab" style="color:var(--muted);font-size:14px">চালু</span>${sw(a.active !== false, 'name="active"')}
          <button class="btn" data-act="save">সেভ</button>
          ${a.image ? '<button class="btn danger" data-act="clear">ছবি সরান</button>' : ''}
        </div>
      </div>`; }).join('')}</div>`;
  main.onchange = (e) => {
    if (e.target.name !== 'file' || !e.target.files[0]) return;
    const prev = e.target.closest('.ad').querySelector('.prev');
    prev.innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" alt="">`;
  };
  main.onclick = async (e) => {
    const act = e.target.dataset.act; if (!act) return;
    const card = e.target.closest('.ad'); const slot = +card.dataset.slot;

    if (act === 'clear') {
      if (!confirm(`জায়গা ${bn(slot)}-এর ছবি সরাবেন?`)) return;
      if (ok(await sb.from('ads').upsert({ slot, image: null, updated_at: new Date().toISOString() }), 'ছবি সরানো হয়েছে')) {
        removeAdFile(old); renderAds(main);
      }
      return;
    }
    e.target.disabled = true; e.target.textContent = 'সেভ হচ্ছে…';
    let image = old ?? null;
    const file = card.querySelector('[name=file]').files[0];
    if (file) {
      if (file.size > 2 * 1024 * 1024) { toast('ছবি ২ MB-এর বেশি — ছোট করে দিন', true); return renderAds(main); }
      const path = `slot-${slot}-${Date.now()}.${(file.name.split('.').pop() || 'jpg').toLowerCase()}`;
      const up = await sb.storage.from('ads').upload(path, file, { contentType: file.type, cacheControl: '31536000' });
      if (!ok(up)) return renderAds(main);
      image = sb.storage.from('ads').getPublicUrl(path).data.publicUrl;
    }
    const v = { slot, image, url: card.querySelector('[name=url]').value.trim() || null,
      advertiser: card.querySelector('[name=advertiser]').value.trim() || null,
      active: card.querySelector('[name=active]').checked, updated_at: new Date().toISOString() };
    if (ok(await sb.from('ads').upsert(v), 'বিজ্ঞাপন সেভ হয়েছে')) { if (file) removeAdFile(old); }
    renderAds(main);
  };
}

function removeAdFile(url) {
  const m = url && url.match(/\/object\/public\/ads\/(.+)$/);

}

  }
  me = session.user;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  let saved = null;
  try { saved = localStorage.getItem('admin.page'); } catch {}
  go(PAGES[saved] ? saved : 'home');
}
function showLogin(msg = '') {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginErr').textContent = msg;
}
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pass').value });
  btn.disabled = false;
  if (error) return ($('#loginErr').textContent = error.message === 'Invalid login credentials' ? 'ইমেইল বা পাসওয়ার্ড ভুল।' : error.message);
  start();
};
start();
</script>
