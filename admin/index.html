<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bay Trip অ্যাডমিন</title>
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@font-face { font-family: Noirrit; src: url(../fonts/LiAdorNoirrit-Regular.ttf); font-weight: 400; }
@font-face { font-family: Noirrit; src: url(../fonts/LiAdorNoirrit-SemiBold.ttf); font-weight: 600; }
:root {
  --bg: #EEF3F6; --card: #FFFFFF; --card-2: #F6F9FB; --ink: #0F2430; --muted: #5E717C; --faint: #8DA0AB; --line: #E2E9EE;
  --sea: #0B6A8C; --btn: #0B6A8C; --sea-ink: #0B5C7A; --sea-soft: #E2F1F7; --navy: #0A3A50; --navy-2: #072B3B;
  --accent: #FF8A5C; --accent-soft: #FFEDE5;
  --ok: #1E8E5A; --ok-soft: #E1F4EA; --warn: #B7791F; --warn-soft: #FCF1DE; --bad: #C93B3B; --bad-soft: #FBE6E6;
  --sun: #F4B740;
  --shadow: 0 1px 2px rgba(15,36,48,.05), 0 8px 24px rgba(15,36,48,.06);
  --shadow-lg: 0 24px 60px rgba(7,43,59,.28);
  --r: 18px;
}
:root[data-theme="dark"] {
  --bg: #0A141A; --card: #111F27; --card-2: #0D1920; --ink: #E6EEF2; --muted: #95A8B3; --faint: #6D818C; --line: #1F3340;
  --sea: #4DB6DC; --btn: #1A7FA6; --sea-ink: #7CCBE7; --sea-soft: #12303C; --navy: #0B2C3B; --navy-2: #071E29;
  --accent-soft: #3A2419; --ok-soft: #10301F; --warn-soft: #33270F; --bad-soft: #391818;
  --shadow: 0 1px 0 rgba(255,255,255,.02); --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A141A; --card: #111F27; --card-2: #0D1920; --ink: #E6EEF2; --muted: #95A8B3; --faint: #6D818C; --line: #1F3340;
    --sea: #4DB6DC; --btn: #1A7FA6; --sea-ink: #7CCBE7; --sea-soft: #12303C; --navy: #0B2C3B; --navy-2: #071E29;
    --accent-soft: #3A2419; --ok-soft: #10301F; --warn-soft: #33270F; --bad-soft: #391818;
    --shadow: 0 1px 0 rgba(255,255,255,.02); --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 Noirrit, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--sea); }
.hidden { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; }
svg .f { fill: currentColor; fill-opacity: .2; stroke: none; }

/* ───── লগইন ───── */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login .art { position: relative; overflow: hidden; color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(165deg, #1A86AE 0%, #0B4D68 55%, #062E40 100%); }
.login .art h2 { font-size: 40px; line-height: 1.2; margin: 0 0 10px; max-width: 460px; }
.login .art p { opacity: .82; max-width: 420px; margin: 0; }
.login .art .waves { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 220px; }
.login .art .brand { display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 20px; position: relative; }
.login .art .brand img { width: 46px; height: 46px; border-radius: 13px; }
.login .art .feat { position: relative; display: grid; gap: 10px; margin-top: 28px; }
.login .art .feat div { display: flex; gap: 10px; align-items: center; opacity: .92; }
.login .art .feat span { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.14); display: grid; place-items: center; }
.login .pane { display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.login form { width: 100%; max-width: 380px; }
.login h1 { font-size: 28px; margin: 0 0 4px; }
.login .sub { color: var(--muted); margin: 0 0 26px; }

label.l { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.input, input[type=text], input[type=email], input[type=password], input[type=number], input[type=time], input[type=url],
input[type=datetime-local], select, textarea {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--sea); box-shadow: 0 0 0 4px var(--sea-soft); }
textarea { min-height: 96px; resize: vertical; }
.money { position: relative; }
.money input { padding-left: 30px; }
.money::before { content: "৳"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer;
  background: var(--btn); color: #fff; white-space: nowrap; transition: transform .08s, filter .15s, background .15s; text-decoration: none; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.accent { background: var(--accent); }
.btn.ghost { background: var(--card); color: var(--sea-ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--sea-soft); filter: none; }
.btn.soft { background: var(--sea-soft); color: var(--sea-ink); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.danger:hover { background: var(--bad-soft); filter: none; }
.btn.sm { padding: 7px 11px; font-size: 14px; border-radius: 10px; }
.btn.icon { padding: 8px; width: 36px; height: 36px; }
.btn.full { width: 100%; margin-top: 22px; padding: 13px; }
.err { color: var(--bad); font-size: 14px; margin-top: 12px; min-height: 1em; }

/* ───── শেল ───── */
.shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; color: #fff; padding: 20px 14px; display: flex; flex-direction: column; gap: 2px;
  background: radial-gradient(400px 260px at 0% 0%, rgba(26,134,174,.35), transparent 70%), linear-gradient(180deg, var(--navy), var(--navy-2)); }
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 20px; }
.brand img { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
.brand b { font-size: 19px; display: block; line-height: 1.1; }
.brand small { opacity: .65; font-size: 12px; }
.side .group { font-size: 11.5px; letter-spacing: .06em; opacity: .5; padding: 14px 12px 6px; }
.nav { border: 0; background: transparent; color: rgba(255,255,255,.76); text-align: left; padding: 6px 8px; border-radius: 14px; cursor: pointer;
  display: flex; gap: 12px; align-items: center; transition: background .15s, color .15s; width: 100%; }
.nav .ni { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--c, #fff);
  background: color-mix(in srgb, var(--c, #fff) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c, #fff) 22%, transparent);
  transition: background .15s, transform .15s; }
.nav .ni svg { width: 19px; height: 19px; }
.nav:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav:hover .ni { background: color-mix(in srgb, var(--c, #fff) 26%, transparent); transform: translateY(-1px); }
.nav.on { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
.nav.on .ni { background: linear-gradient(140deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); border-color: transparent; color: #fff;
  box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 45%, transparent); }
.nav.on .ni svg .f { fill-opacity: .32; }
.nav .count { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.14); padding: 1px 8px; border-radius: 99px; }
.side .grow { flex: 1; min-height: 16px; }
.me { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.06); margin-top: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; }
.me .who { min-width: 0; flex: 1; }
.me b { display: block; font-size: 13px; }
.me small { display: block; font-size: 11.5px; opacity: .65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me button { background: transparent; border: 0; color: rgba(255,255,255,.7); cursor: pointer; padding: 6px; border-radius: 8px; }
.me button:hover { background: rgba(255,255,255,.1); color: #fff; }

.wrap { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 16px 32px; background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top h2 { margin: 0; font-size: 24px; line-height: 1.2; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.top .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 13px; color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(30,142,90,.5); animation: ping 2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(30,142,90,.45); } 70% { box-shadow: 0 0 0 8px rgba(30,142,90,0); } 100% { box-shadow: 0 0 0 0 rgba(30,142,90,0); } }
.burger { display: none; }
main { padding: 8px 32px 64px; max-width: 1480px; width: 100%; }

/* ───── কার্ড ───── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.card-h .ic { width: 40px; height: 40px; border-radius: 13px; border: 1px solid color-mix(in srgb, currentColor 14%, transparent); display: grid; place-items: center; background: var(--sea-soft); color: var(--sea-ink); flex: none; }
.card-h .ic.accent { background: var(--accent-soft); color: var(--accent); }
.card-h .ic.ok { background: var(--ok-soft); color: var(--ok); }
.card-h .ic.warn { background: var(--warn-soft); color: var(--warn); }
.card-h h3 { margin: 0; font-size: 17px; line-height: 1.25; }
.card-h small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
.card-h .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: 1.4fr 1fr; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stack { display: grid; gap: 18px; }

/* হিরো */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 26px 28px; color: #fff; margin-bottom: 18px;
  background: linear-gradient(120deg, #1A86AE 0%, #0B5C7A 50%, #0A3A50 100%); box-shadow: var(--shadow); }
.hero h3 { margin: 0; font-size: 26px; }
.hero p { margin: 4px 0 18px; opacity: .85; max-width: 560px; }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; position: relative; }
.hero .btn.ghost { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.2); }
.hero .btn.ghost:hover { background: rgba(255,255,255,.22); }
.hero svg.bg { position: absolute; right: -20px; bottom: -10px; width: 460px; max-width: 70%; opacity: .9; pointer-events: none; }

/* KPI */
.kpi { display: flex; gap: 14px; align-items: center; }
.kpi .ic { width: 48px; height: 48px; border-radius: 15px; border: 1px solid color-mix(in srgb, currentColor 14%, transparent); display: grid; place-items: center; flex: none; }
.kpi .ic svg { width: 22px; height: 22px; }
.kpi b { font-size: 28px; line-height: 1.1; display: block; }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi .ic.sea { background: var(--sea-soft); color: var(--sea-ink); }
.kpi .ic.accent { background: var(--accent-soft); color: var(--accent); }
.kpi .ic.ok { background: var(--ok-soft); color: var(--ok); }
.kpi .ic.warn { background: var(--warn-soft); color: var(--warn); }

/* তালিকা */
.list { display: grid; }
.li { display: grid; gap: 10px; align-items: center; padding: 11px 4px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li.off { opacity: .5; }
.li input[type=text], .li input[type=number], .li input[type=time], .li select { padding: 9px 11px; }
.trip-li { grid-template-columns: 118px 92px minmax(0, 1fr) auto auto auto; }
.fare-li { grid-template-columns: 44px minmax(0, 1.4fr) 110px minmax(0, 1fr) auto auto; }
.pin-li { grid-template-columns: auto minmax(0, 1fr) auto auto auto; }
.tide-li { grid-template-columns: 92px minmax(0, 1fr) 80px 120px 36px; font-size: 14.5px; }
.tlabel { font-size: 13px; color: var(--muted); background: var(--card-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; text-align: center; white-space: nowrap; }
.empty { color: var(--muted); font-size: 14px; padding: 26px 12px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.empty svg { width: 40px; height: 40px; color: var(--faint); }
.fare-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--sea-soft); color: var(--sea-ink); display: grid; place-items: center; }

.switch { position: relative; width: 42px; height: 24px; flex: none; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 24px; background: var(--line); cursor: pointer; transition: .2s; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(18px); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 10px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.pill.info { background: var(--sea-soft); color: var(--sea-ink); }
.pill.warning { background: var(--warn-soft); color: var(--warn); }
.pill.closed { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.mute { background: var(--card-2); color: var(--muted); border: 1px solid var(--line); }
.pill.high { background: var(--sea-soft); color: var(--sea-ink); }
.pill.low { background: var(--accent-soft); color: var(--accent); }

/* পরের ট্রিপ */
.next { display: grid; gap: 8px; }
.next .dirh { font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 0 2px; display: flex; align-items: center; gap: 6px; }
.next .t { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.next .t b { font-size: 16px; }
.next .t .in { margin-left: auto; font-size: 13px; color: var(--muted); }
.next .t.first { background: var(--sea-soft); border-color: transparent; }
.next .t.first .in { color: var(--sea-ink); font-weight: 600; }

/* জোয়ার-ভাটা চার্ট */
.tchart { width: 100%; height: auto; max-height: 260px; display: block; }
.tchart .lbl { font: 600 11px Noirrit, sans-serif; fill: var(--muted); }
.tsum { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.tsum div { flex: 1; min-width: 130px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.tsum small { display: block; color: var(--muted); font-size: 12px; }
.tsum b { font-size: 15px; }

/* মিনি ম্যাপ */
.minimap { height: 280px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--card-2); }
.vessel-mk { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.3); display: grid; place-items: center; color: #fff; }

/* নোটিশ */
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); gap: 4px; flex-wrap: wrap; }
.seg label { cursor: pointer; }
.seg input { display: none; }
.seg span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg input:checked + span { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.preview { border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.preview.info { background: var(--sea-soft); color: var(--sea-ink); }
.preview.warning { background: var(--warn-soft); color: var(--warn); }
.preview.closed { background: var(--bad-soft); color: var(--bad); }
.notice { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--line); }
.notice:first-child { border-top: 0; }
.notice .bar { align-self: stretch; border-radius: 4px; background: var(--sea); }
.notice.warning .bar { background: var(--warn); }
.notice.closed .bar { background: var(--bad); }
.notice p { margin: 6px 0 0; }
.notice small { color: var(--muted); }
.notice.off { opacity: .5; }

/* বিজ্ঞাপন */
.ads { display: grid; gap: 18px; }
.drop { aspect-ratio: 6 / 1; border-radius: 14px; overflow: hidden; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer;
  border: 2px dashed var(--line); background: linear-gradient(135deg, var(--sea-soft), var(--card-2)); position: relative; transition: border-color .15s; }
.drop:hover, .drop.over { border-color: var(--sea); }
.drop img { width: 100%; height: 100%; object-fit: cover; display: block; }
.drop .hint2 { display: grid; gap: 4px; justify-items: center; padding: 8px; }
.drop input { display: none; }
.ad-f { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; margin-top: 12px; }

/* PIN */
.pin { font: 600 18px ui-monospace, Menlo, monospace; letter-spacing: 3px; padding: 6px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); min-width: 120px; text-align: center; }

.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; display: flex; gap: 6px; align-items: flex-start; }
.hint.warn { color: var(--warn); }
.form-row { display: grid; gap: 10px; align-items: end; }

/* লোডিং */
.sk { border-radius: 14px; background: linear-gradient(90deg, var(--card-2) 0%, var(--line) 50%, var(--card-2) 100%); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* টোস্ট ও ডায়ালগ */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); opacity: 0; background: #0F2430; color: #fff; padding: 11px 18px;
  border-radius: 14px; transition: .25s; z-index: 60; font-size: 15px; pointer-events: none; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.bad { background: var(--bad); }
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(5,20,28,.5); backdrop-filter: blur(3px); }
.modal .box { background: var(--card); border-radius: 20px; padding: 22px; max-width: 400px; width: 100%; box-shadow: var(--shadow-lg); }
.modal h4 { margin: 0 0 6px; font-size: 18px; }
.modal p { margin: 0 0 18px; color: var(--muted); }
.modal .acts { display: flex; gap: 10px; justify-content: flex-end; }
.scrim { display: none; }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .login { grid-template-columns: 1fr; }
  .login .art { display: none; }
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; z-index: 50; transform: translateX(-100%); transition: transform .25s; }
  .shell.open .side { transform: none; box-shadow: var(--shadow-lg); }
  .shell.open .scrim { display: block; position: fixed; inset: 0; background: rgba(5,20,28,.45); z-index: 40; }
  .burger { display: inline-flex; }
  .top { padding: 12px 16px; }
  .top h2 { font-size: 20px; }
  .top p, .top .chip.date { display: none; }
  main { padding: 6px 16px 56px; }
  .g2 { grid-template-columns: 1fr; }
  .hero { padding: 22px 20px; }

function fmtTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  const part = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 15 ? 'দুপুর' : h < 18 ? 'বিকেল' : h < 20 ? 'সন্ধ্যা' : 'রাত';
  return `${part} ${bn((h % 12) || 12)}:${bn(String(m).padStart(2, '0'))}`;
}

}

}

  if (m < 1440) return bn(Math.round(m / 60)) + ' ঘণ্টা আগে';
  return bn(Math.round(m / 1440)) + ' দিন আগে';
}

/* ───── জোয়ার-ভাটার চার্ট ───── */
// জোয়ার-ভাটার চরম বিন্দুগুলোর মাঝে কোসাইন বক্ররেখা — অ্যাপের মতোই
function tideSvg(rows) {
  const now = Date.now(), from = now - 6 * 3600e3, to = now + 18 * 3600e3;
  const pts = rows.map((r) => ({ t: new Date(r.time).getTime(), h: r.height ?? (r.type === 'high' ? 1 : -1), type: r.type })).sort((a, b) => a.t - b.t);
  if (pts.length < 2) return '';
  const W = 640, H = 190, top = 30, bot = 40;
  const hs = pts.map((p) => p.h), lo = Math.min(...hs), hi = Math.max(...hs);
  const x = (t) => ((t - from) / (to - from)) * W;
  const y = (h) => top + (1 - (h - lo) / ((hi - lo) || 1)) * (H - top - bot);
  const at = (t) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      if (t >= a.t && t <= b.t) { const f = (t - a.t) / (b.t - a.t); return a.h + (b.h - a.h) * (1 - Math.cos(Math.PI * f)) / 2; }
    }
    return null;
  };
  let d = '', first = null;
  for (let t = from; t <= to; t += 10 * 60000) { const h = at(t); if (h == null) continue; const p = `${x(t).toFixed(1)},${y(h).toFixed(1)}`; d += (d ? ' L' : 'M') + p; if (!first) first = x(t); }
  const last = x(Math.min(to, pts[pts.length - 1].t));
  const area = d ? `${d} L${last.toFixed(1)},${H - bot} L${(first ?? 0).toFixed(1)},${H - bot} Z` : '';
  const marks = pts.filter((p) => p.t >= from && p.t <= to).map((p) => {
    const px = x(p.t), py = y(p.h), up = p.type === 'high', lx = Math.min(W - 30, Math.max(30, px));
    return `<circle cx="${px}" cy="${py}" r="5" fill="var(--card)" stroke="${up ? 'var(--sea)' : 'var(--accent)'}" stroke-width="2.5"/>
      <text class="lbl" x="${lx}" y="${up ? py - 12 : py + 20}" text-anchor="middle">${dhakaClock(new Date(p.t).toISOString())}</text>`;
  }).join('');
  const nx = x(now), nh = at(now);
  // বাংলাদেশ সময়ে প্রতি ৬ ঘণ্টায় দাগ (বাংলাদেশ = UTC+৬)
  const BD = 6 * 3600e3, sixH = 6 * 3600e3;
  const ticks = [];
  for (let t = Math.ceil((from + BD) / sixH) * sixH - BD; t < to; t += sixH) ticks.push(t);
  const hours = ticks.map((t) =>
    `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 10}" y2="${H - bot}" stroke="var(--line)"/><text class="lbl" x="${x(t)}" y="${H - 14}" text-anchor="middle">${dhakaClock(new Date(t).toISOString())}</text>`).join('');
  return `<svg class="tchart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sea)" stop-opacity=".35"/><stop offset="1" stop-color="var(--sea)" stop-opacity="0"/></linearGradient></defs>
    ${hours}<path d="${area}" fill="url(#tg)"/><path d="${d}" fill="none" stroke="var(--sea)" stroke-width="2.5"/>
    <line x1="${nx}" x2="${nx}" y1="${top - 14}" y2="${H - bot}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"/>
    ${nh != null ? `<circle cx="${nx}" cy="${y(nh)}" r="6" fill="var(--accent)" stroke="#fff" stroke-width="2"/>` : ''}
    ${marks}</svg>`;
}
function tideSummary(rows) {
  const now = Date.now();
  const next = (type) => rows.find((r) => r.type === type && new Date(r.time).getTime() > now);
  const prev = [...rows].reverse().find((r) => new Date(r.time).getTime() <= now);
  const rising = prev ? prev.type === 'low' : null;
  const nh = next('high'), nl = next('low');
  return `<div class="tsum">
    <div><small>এখন</small><b>${rising == null ? '—' : rising ? '↑ পানি বাড়ছে' : '↓ পানি কমছে'}</b></div>
    <div><small>পরের জোয়ার</small><b>${nh ? dhakaClock(nh.time) : '—'}</b></div>
    <div><small>পরের ভাটা</small><b>${nl ? dhakaClock(nl.time) : '—'}</b></div></div>`;
}

async function renderTrips(main) {

/* ───── বিজ্ঞাপন ───── */
async function renderAds(main) {
  const res = await sb.from('ads').select('*').order('slot');
  if (!ok(res)) return;
  const by = Object.fromEntries(res.data.map((a) => [a.slot, a]));
  main.innerHTML = `<div class="ads">${[1, 2, 3].map((s) => {
    const a = by[s] ?? { slot: s, active: true };
    const state = a.image ? (a.active ? '<span class="pill ok">● চলছে</span>' : '<span class="pill mute">বন্ধ</span>') : '<span class="pill mute">খালি</span>';
    return `<div class="card" data-slot="${s}">${cardH('ads', `জায়গা ${bn(s)}`, a.updated_at ? `শেষ বদল ${ago(a.updated_at)}` : 'এখনো কিছু বসানো হয়নি', state, 'accent')}
      <label class="drop">
        <input type="file" accept="image/png,image/jpeg,image/webp" name="file">
        ${a.image ? `<img src="${esc(a.image)}" alt="">` : `<div class="hint2">${ic('upload')}<b>ছবি বেছে নিন বা এখানে টেনে আনুন</b><small>১২০০ × ২০০ পিক্সেল · JPG/PNG · ২ MB-এর কম</small></div>`}
      </label>
      <div class="ad-f">
        <input type="text" class="grow2" name="url" value="${esc(a.url)}" placeholder="চাপলে যা খুলবে: https://… বা tel:01XXXXXXXXX">
        <input type="text" name="advertiser" value="${esc(a.advertiser)}" placeholder="বিজ্ঞাপনদাতা (নিজের হিসাবের জন্য)">
        <span style="display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px">চালু ${sw(a.active !== false, 'name="active"')}</span>
        <button class="btn" data-act="save">${ic('save')}সেভ</button>
        ${a.image ? `<button class="btn danger" data-act="clear">${ic('trash')}ছবি সরান</button>` : '<span></span>'}
      </div></div>`;
  }).join('')}</div>
  <p class="hint">${ic('info')}<span>ছবি না থাকলে অ্যাপে সেই জায়গায় "বিজ্ঞাপন দিন" কার্ড দেখায়। ছবিতে ছোট লেখা না রাখাই ভালো — ফোনে ছোট দেখায়।</span></p>`;
  const showFile = (card, file) => {
    if (!file) return;
    const dt = new DataTransfer(); dt.items.add(file); card.querySelector('[name=file]').files = dt.files;
    card.querySelector('.drop').innerHTML = `<input type="file" accept="image/png,image/jpeg,image/webp" name="file"><img src="${URL.createObjectURL(file)}" alt="">`;
    card.querySelector('[name=file]').files = dt.files;
  };
  main.onchange = (e) => { if (e.target.name === 'file') showFile(e.target.closest('[data-slot]'), e.target.files[0]); };
  main.querySelectorAll('.drop').forEach((d) => {
    d.ondragover = (e) => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = (e) => { e.preventDefault(); d.classList.remove('over'); showFile(d.closest('[data-slot]'), e.dataTransfer.files[0]); };
  });
  main.onclick = async (e) => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const card = btn.closest('[data-slot]'); const slot = +card.dataset.slot;
    const old = by[slot]?.image;
    if (btn.dataset.act === 'clear') {
      if (!(await ask('ছবি সরাবেন?', `জায়গা ${bn(slot)}-এ আবার "বিজ্ঞাপন দিন" কার্ড দেখাবে।`, 'সরান'))) return;
      if (ok(await sb.from('ads').upsert({ slot, image: null, updated_at: new Date().toISOString() }), 'ছবি সরানো হয়েছে')) { removeAdFile(old); renderAds(main); }
      return;
    }
    btn.disabled = true; btn.textContent = 'সেভ হচ্ছে…';
    let image = old ?? null;
    const file = card.querySelector('[name=file]').files[0];
    if (file) {
      if (file.size > 2 * 1024 * 1024) { toast('ছবি ২ MB-এর বেশি — ছোট করে দিন', true); return renderAds(main); }
      const path = `slot-${slot}-${Date.now()}.${(file.name.split('.').pop() || 'jpg').toLowerCase()}`;
      const up = await sb.storage.from('ads').upload(path, file, { contentType: file.type, cacheControl: '31536000' });
      if (!ok(up)) return renderAds(main);
      image = sb.storage.from('ads').getPublicUrl(path).data.publicUrl;
    }
    const v = { slot, image, url: card.querySelector('[name=url]').value.trim() || null,
      advertiser: card.querySelector('[name=advertiser]').value.trim() || null,
      active: card.querySelector('[name=active]').checked, updated_at: new Date().toISOString() };
    if (ok(await sb.from('ads').upsert(v), 'বিজ্ঞাপন সেভ হয়েছে')) { if (file) removeAdFile(old); }
    renderAds(main);
  };
}
// পুরনো ছবি Storage থেকে মুছে জায়গা বাঁচাও
function removeAdFile(url) {
  const m = url && url.match(/\/object\/public\/ads\/(.+)$/);
  if (m) sb.storage.from('ads').remove([decodeURIComponent(m[1])]);
}

          <div><b>${esc(vesselName(v.vessel_id))}</b><br><small style="color:var(--muted)">${v.direction ? DIR[v.direction] ?? esc(v.direction) : '—'} · ${ago(v.updated_at)}</small></div>
          <span class="pill ${live ? 'ok' : 'mute'}">${live ? '● চলছে' : v.on_trip ? 'সংকেত নেই' : 'থেমে আছে'}</span>
          ${v.lat != null ? `<a class="btn icon ghost" target="_blank" rel="noopener" title="OpenStreetMap-এ খুলুন" href="https://www.openstreetmap.org/?mlat=${v.lat}&mlon=${v.lng}#map=15/${v.lat}/${v.lng}">${ic('ext')}</a>` : '<span></span>'}
          <button class="btn icon danger" data-act="del" data-id="${esc(v.vessel_id)}" title="তালিকা থেকে সরান">${ic('trash')}</button>
        </div>`; }).join('') || emptyBox('live', 'এখনো কোনো সি ট্রাক লোকেশন পাঠায়নি')}</div>
      <p class="hint">${ic('info')}<span>"যাত্রীদের লোকেশন থেকে" মানে সি ট্রাকে থাকা যাত্রীরা নাম ছাড়া লোকেশন দিচ্ছেন। স্টাফের ড্রাইভার মোড চালু থাকলে অ্যাপে সেটাই আগে দেখায়।</span></p>
    </div></div>`;
  $('#refresh').onclick = () => go('live');
  main.onclick = async (e) => {
    const btn = e.target.closest('[data-act="del"]'); if (!btn) return;
    if (!(await ask('তালিকা থেকে সরাবেন?', 'আবার লোকেশন এলে নিজে থেকেই ফিরে আসবে।', 'সরান'))) return;
    if (ok(await sb.from('vessel_locations').delete().eq('vessel_id', btn.dataset.id), 'সরানো হয়েছে')) go('live');
  };
  drawMap($('#minimap'), liveV);
}

/* ───── লগইন ───── */
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const adm = await sb.rpc('is_admin');
  if (adm.error || !adm.data) {
    await sb.auth.signOut();
    return showLogin(adm.error ? 'সংযোগে সমস্যা: ' + adm.error.message : 'এই অ্যাকাউন্ট অ্যাডমিন নয়।');
  }
  me = session.user;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  let saved = null;
  try { saved = localStorage.getItem('admin.page'); } catch {}
  go(PAGES[saved] ? saved : 'home');
}
function showLogin(msg = '') {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginErr').textContent = msg;
}
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'লগইন হচ্ছে…'; $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pass').value });
  btn.disabled = false; btn.textContent = 'লগইন';
  if (error) return ($('#loginErr').textContent = error.message === 'Invalid login credentials' ? 'ইমেইল বা পাসওয়ার্ড ভুল।' : error.message);
  start();
};
addEventListener('online', () => ($('#conn').innerHTML = '<span class="dot"></span>সংযুক্ত'));
addEventListener('offline', () => ($('#conn').innerHTML = '<span class="dot" style="background:var(--bad);animation:none"></span>অফলাইন'));
start();
</script>
